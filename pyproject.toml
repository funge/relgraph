[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relgraph-parser"
version = "0.1.0"
description = "Experimental headless canonical formula parsing"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
